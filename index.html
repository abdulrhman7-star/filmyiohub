<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineHub — Movie Search & Arabic Subtitles</title>
    <style>
        :root {
            --bg: #07080c;
            --surface: rgba(18, 21, 30, .86);
            --text: #f7f8fb;
            --muted: #99a2b3;
            --line: rgba(255,255,255,.09);
            --accent: #e50914;
            --accent-2: #ff3340;
            --success: #28d17c;
            --warning: #f59e0b;
            --radius: 18px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; color: var(--text);
            background: linear-gradient(180deg, #07080c 0%, #090b10 48%, #06070a 100%);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        .container { width: min(1180px, calc(100% - 32px)); margin: auto; position: relative; z-index: 1; }
        
        .site-header {
            position: sticky; top: 0; z-index: 50;
            border-bottom: 1px solid var(--line);
            background: rgba(7,8,12,.78); backdrop-filter: blur(20px);
        }
        .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: inline-flex; align-items: center; gap: 11px; color: #fff; text-decoration: none; font-size: 20px; font-weight: 850; }
        .brand-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: linear-gradient(145deg, var(--accent-2), var(--accent)); }
        .brand span { color: var(--accent-2); }

        .hero { padding: 60px 0 30px; text-align: center; }
        .hero h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 900; }
        .hero h1 strong { color: var(--accent-2); }
        
        .search-box {
            max-width: 750px; margin: 25px auto 0; padding: 7px; display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,.12); border-radius: 16px; background: rgba(17,20,28,.92);
        }
        .search-box input { flex: 1; border: 0; outline: 0; background: transparent; color: #fff; padding: 15px; font-size: 16px; }
        .search-box button { border: 0; border-radius: 12px; padding: 0 24px; min-height: 50px; color: #fff; background: linear-gradient(135deg, var(--accent-2), var(--accent)); font-weight: 800; cursor: pointer; }

        #results { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 17px; margin-top: 24px; }
        .movie-card { border: 1px solid var(--line); border-radius: 14px; background: #151923; cursor: pointer; overflow: hidden; transition: transform .25s ease; }
        .movie-card:hover { transform: translateY(-6px); border-color: rgba(229,9,20,.65); }
        .movie-card img, .no-poster { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
        .no-poster { display: grid; place-items: center; color: #5e6778; }
        .movie-card .info { padding: 12px; }
        .movie-card .info h3 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .detail-panel { background: #141923; border: 1px solid var(--line); border-radius: var(--radius); padding: 25px; margin-top: 26px; display: none; }
        .detail-panel.active { display: block; }
        
        .player-section { display: none; margin: 28px 0 60px; border-radius: var(--radius); background: #050608; border: 1px solid var(--line); overflow: hidden; }
        .player-section.active { display: block; }
        .player-header { padding: 12px 16px; background: #11141b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
        
        .status-banner { padding: 10px 16px; background: #1a202c; color: var(--warning); font-size: 13px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
        .status-banner.success { color: var(--success); background: rgba(40,209,124,0.1); }
        .status-banner.error { color: var(--accent-2); background: rgba(229,9,20,0.1); }

        .player-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
        .player-container iframe { width: 100%; height: 100%; border: 0; }

        .action-btns { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { border: 0; border-radius: 9px; padding: 10px 17px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; font-weight: 750; cursor: pointer; }
        .btn-outline { background: #161b25; border: 1px solid var(--line); color: #c9ced8; }
        .loading { grid-column: 1 / -1; text-align: center; padding: 55px; color: var(--muted); }

        @media(max-width: 900px) { #results { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 600px) { #results { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="#">
                <span class="brand-icon">▶</span> Cine<span>Hub</span>
            </a>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>ابحث عن فيلمك أو مسلسلك المفضلة<br><strong>مع تفعيل الترجمة العربية الذكية</strong></h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم (مثال: Avengers, Inception)..." />
                <button id="searchBtn">🔎 بحث</button>
            </div>
        </section>

        <section>
            <h2>نتائج البحث</h2>
            <div id="results"></div>
        </section>

        <div class="detail-panel" id="detailPanel">
            <h2 id="detailTitle" style="margin-bottom:8px;"></h2>
            <p id="detailOverview" style="color:var(--muted); margin-bottom:12px;"></p>
            <div id="detailIds" style="margin-bottom:15px;"></div>
            
            <div class="action-btns">
                <button class="btn" id="playArabicBtn">🇸🇦 تشغيل بالترجمة العربية</button>
                <button class="btn btn-outline" id="closeDetailBtn">✕ إغلاق</button>
            </div>
        </div>

        <section class="player-section" id="playerSection">
            <div class="player-header">
                <h2 id="playerTitle">مشغل الوسائط</h2>
                <button class="btn btn-outline" id="closePlayerBtn" style="padding:5px 10px; font-size:12px;">✕ إغلاق</button>
            </div>
            <div class="status-banner" id="statusBanner">
                <span id="statusText">جاهز للتشغيل...</span>
            </div>
            <div class="player-container">
                <iframe id="mediaPlayer" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <script>
        const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJiZTU5ZTZhYzJjODQyNDE4ZDljYTgwNGU1NjBiMGU5ZCIsIm5iZiI6MTc4NjIxNjU5OS44MTQwMDAxLCJzdWIiOiI2YTc3ODA5Nzk2ZWYxYzZkYjJhMzcwN2EiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.LjmNC3JhcV_9khMSh7aXdqTyx4uTXgmtOspFuQSASkU';
        
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const detailPanel = document.getElementById('detailPanel');
        const playerSection = document.getElementById('playerSection');
        const mediaPlayer = document.getElementById('mediaPlayer');
        const statusBanner = document.getElementById('statusBanner');
        const statusText = document.getElementById('statusText');
        
        let currentMetadata = null;

        function updateStatus(text, type = "loading") {
            statusText.textContent = text;
            statusBanner.className = `status-banner ${type}`;
        }

        async function searchMedia(query) {
            if (!query) return;
            resultsDiv.innerHTML = `<div class="loading">⏳ جاري البحث...</div>`;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(query)}&language=ar`, {
                    headers: { 'Authorization': `Bearer ${TMDB_TOKEN}` }
                });
                const data = await res.json();
                displayResults(data.results || []);
            } catch (err) {
                resultsDiv.innerHTML = `<div class="loading">⚠️ حدث خطأ في الاتصال</div>`;
            }
        }

        function displayResults(items) {
            resultsDiv.innerHTML = items.map(item => {
                const title = item.title || item.name || 'بدون عنوان';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : '';
                const type = item.media_type === 'tv' ? 'tv' : 'movie';
                return `
                    <div class="movie-card" onclick='selectItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                        ${poster ? `<img src="${poster}" />` : `<div class="no-poster">📽️</div>`}
                        <div class="info">
                            <h3>${title}</h3>
                            <span style="font-size:11px; color:var(--muted);">${type.toUpperCase()}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.selectItem = async function(item) {
            const type = item.media_type === 'tv' ? 'tv' : 'movie';
            const detailsRes = await fetch(`https://api.themoviedb.org/3/${type}/${item.id}?append_to_response=external_ids`, {
                headers: { 'Authorization': `Bearer ${TMDB_TOKEN}` }
            });
            const details = await detailsRes.json();

            currentMetadata = {
                type: type,
                tmdbId: details.id,
                imdbId: details.imdb_id || details.external_ids?.imdb_id,
                title: details.title || details.name,
                season: type === 'tv' ? 1 : null,
                episode: type === 'tv' ? 1 : null
            };

            document.getElementById('detailTitle').textContent = currentMetadata.title;
            document.getElementById('detailOverview').textContent = details.overview || 'لا يوجد ملخص.';
            document.getElementById('detailIds').innerHTML = `
                <span style="background:#1a202c; padding:4px 8px; border-radius:6px; font-size:12px;">TMDB: ${currentMetadata.tmdbId}</span>
                ${currentMetadata.imdbId ? `<span style="background:#1a202c; padding:4px 8px; border-radius:6px; font-size:12px; margin-right:5px;">IMDb: ${currentMetadata.imdbId}</span>` : ''}
            `;
            detailPanel.classList.add('active');
            detailPanel.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('playArabicBtn').addEventListener('click', async () => {
            if (!currentMetadata) return;
            playerSection.classList.add('active');
            playerSection.scrollIntoView({ behavior: 'smooth' });
            
            updateStatus("🇸🇦 جاري جلب الترجمة العربية من OpenSubtitles وتهيئة المشغل...", "loading");

            if (currentMetadata.imdbId) {
                const subtitleProxyUrl = `${window.location.origin}/.netlify/functions/get-arabic-sub?imdbId=${currentMetadata.imdbId}`;
                
                const params = new URLSearchParams({
                    ds_lang: 'ar',                      
                    sub_url: subtitleProxyUrl,          
                    sub_label: 'العربية (مخصص)',         
                    sub_lang: 'ar',                     
                    autoplay: 1
                });

                const embedUrl = `https://vidsrcme.ru/embed/${currentMetadata.type}/${currentMetadata.imdbId}?${params.toString()}`;
                
                setTimeout(() => {
                    mediaPlayer.src = embedUrl;
                    updateStatus("✅ تم تفعيل المشغل مع الترجمة العربية بنجاح", "success");
                }, 1000);

            } else {
                const embedUrl = `https://vidsrcme.ru/embed/${currentMetadata.type}?tmdb=${currentMetadata.tmdbId}&ds_lang=ar`;
                
                setTimeout(() => {
                    mediaPlayer.src = embedUrl;
                    updateStatus("✅ تم تحميل المشغل بالترجمة المتاحة", "success");
                }, 1000);
            }
        });

        document.getElementById('closePlayerBtn').addEventListener('click', () => {
            playerSection.classList.remove('active');
            mediaPlayer.src = '';
        });

        document.getElementById('closeDetailBtn').addEventListener('click', () => {
            detailPanel.classList.remove('active');
        });

        searchBtn.addEventListener('click', () => searchMedia(searchInput.value.trim()));
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchBtn.click(); });
    </script>
</body>
</html>
